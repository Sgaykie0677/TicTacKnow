<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0c0b1f; --bg1:#16123a; --bg2:#221a52;
    --glass:rgba(255,255,255,.06);
    --glass-line:rgba(255,255,255,.10);
    --ink:#eef0fb; --ink-soft:#a7a3c9; --ink-dim:#736e9b;
    --x1:#ff7a7e; --x2:#ee4f54;
    --o1:#37e3d2; --o2:#0fa9a0;
    --gold:#f6c453; --gold-soft:rgba(246,196,83,.16);
    --good:#3ddc84; --bad:#ff5d5d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);min-height:100vh;
    background:
      radial-gradient(900px 500px at 18% -8%, rgba(124,77,255,.30), transparent 60%),
      radial-gradient(800px 520px at 90% 0%, rgba(15,169,160,.22), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg0) 70%);
    display:flex;flex-direction:column;align-items:center;padding:20px 16px 44px;overflow-x:hidden;
  }
  .display{font-family:'Space Grotesk',sans-serif}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}

  header{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{display:flex;flex-direction:column}
  .logo{font-family:'Space Grotesk';font-weight:700;font-size:27px;line-height:1;letter-spacing:-.5px}
  .logo .a{color:var(--x1)} .logo .b{color:var(--ink)} .logo .c{color:var(--gold)}
  .tm{font-size:11px;vertical-align:super;color:var(--ink-dim)}
  .tag{font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-weight:500;letter-spacing:.2px}
  .mute{width:42px;height:42px;border-radius:13px;border:1px solid var(--glass-line);background:var(--glass);
    color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
  .mute:active{transform:scale(.94)}
  .hbtns{display:flex;gap:8px}
  .mute.off{opacity:.5}

  .panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;padding:22px;width:100%;
    backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .panel h2{font-family:'Space Grotesk';margin:0 0 4px;font-size:23px;font-weight:700;letter-spacing:-.3px}
  .panel .sub{margin:0 0 18px;color:var(--ink-soft);font-size:13.5px;font-weight:500}
  .label{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-dim);margin:18px 0 9px}

  .row{display:flex;gap:9px}
  .seg{flex:1;background:rgba(255,255,255,.04);border:1.5px solid var(--glass-line);border-radius:14px;
    padding:13px 8px;font-family:'Inter';font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;
    text-align:center;transition:transform .07s,border-color .15s,background .15s,color .15s}
  .seg:active{transform:scale(.96)}
  .seg.on{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--bg2),#3a2a78);box-shadow:inset 0 0 0 1.5px var(--gold)}
  .seg .ico{display:block;font-size:20px;margin-bottom:4px}
  .seg small{display:block;font-weight:500;font-size:11px;color:var(--ink-dim);margin-top:2px}
  .seg.on small{color:var(--ink-soft)}

  .cats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cat{background:rgba(255,255,255,.04);border:1.5px solid var(--glass-line);border-radius:14px;padding:13px 12px;
    cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .07s,border-color .15s,background .15s}
  .cat:active{transform:scale(.96)}
  .cat.on{border-color:var(--gold);background:var(--gold-soft)}
  .cat .e{font-size:22px}
  .cat .n{font-weight:700;font-size:13.5px;line-height:1.15}
  .cat .ct{font-size:11px;color:var(--ink-dim);font-weight:600}

  .start{margin-top:22px;width:100%;border:none;border-radius:16px;padding:17px;cursor:pointer;
    font-family:'Space Grotesk';font-weight:700;font-size:18px;color:#150a1f;
    background:linear-gradient(135deg,var(--gold),#f0a93a);
    box-shadow:0 10px 30px rgba(246,196,83,.35);transition:transform .07s,box-shadow .15s}
  .start:active{transform:translateY(2px) scale(.99)}

  .gtop{width:100%;display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
  .turn{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);
    border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;backdrop-filter:blur(6px)}
  .turn .pip{width:22px;height:22px;display:grid;place-items:center}
  .catpill{font-size:11px;font-weight:700;letter-spacing:.5px;background:var(--gold-soft);color:var(--gold);
    padding:8px 13px;border-radius:999px;text-transform:uppercase}

  .boardwrap{width:100%;position:relative}
  .board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}
  .cell{position:relative;border-radius:18px;cursor:pointer;display:grid;place-items:center;
    background:linear-gradient(150deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.25);
    transition:transform .1s,border-color .15s,box-shadow .2s;overflow:hidden}
  .cell::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 120px at 50% 0%,rgba(255,255,255,.10),transparent 70%);opacity:0;transition:opacity .2s}
  .cell:not(.taken):active{transform:scale(.96)}
  .cell:not(.taken):hover::after{opacity:1}
  .cell.taken{cursor:default}
  .cell.win{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold), 0 0 34px rgba(246,196,83,.5);animation:winpulse 1s ease infinite alternate}
  @keyframes winpulse{to{box-shadow:0 0 0 2px var(--gold), 0 0 50px rgba(246,196,83,.75)}}
  .cell svg.mark{width:62%;height:62%}
  .pipmark{width:100%;height:100%}
  .mark line,.mark circle{fill:none;stroke-width:11;stroke-linecap:round}

function beep(f,d,t,v){if(muted)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(c.destination);
  const x=c.currentTime;g.gain.setValueAtTime(g.gain.value,x);g.gain.exponentialRampToValueAtTime(.0001,x+d);o.start(x);o.stop(x+d);}

// Paste your deployed Cloudflare Worker URL here after deploying it:
const WORKER_URL="https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";
const AI_ENABLED=!WORKER_URL.includes("YOUR-WORKER-NAME"); // auto-disables until you set the URL above
const QUEUE_TARGET=2; // how many AI questions to keep pre-fetched per category
const aiState={}; // {category: {queue:[...], pending:0, usedTexts:[...]}}
function getAIState(cat){if(!aiState[cat])aiState[cat]={queue:[],pending:0,usedTexts:[]};return aiState[cat];}
async function fetchAIQuestion(cat){
  const st=getAIState(cat);
  try{
    const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({category:CATEGORIES[cat].name,difficulty:S.diff,used:st.usedTexts})});
    const data=await res.json();
    if(data.ok){const q=data.question;
      st.usedTexts.push(q.question);if(st.usedTexts.length>40)st.usedTexts.shift();
      return {text:q.question,correct:q.options[q.correctIndex],answers:shuffle(q.options)};}
  }catch(e){/* network hiccup — silent, fallback bank covers it */}
  return null;
}
function topUpQueue(cat){
  if(!AI_ENABLED)return;
  const st=getAIState(cat);const need=QUEUE_TARGET-st.queue.length-st.pending;
  for(let i=0;i<need;i++){st.pending++;
    fetchAIQuestion(cat).then(q=>{st.pending--;if(q)st.queue.push(q);});}
}
function pickFromBank(){const pool=BANK[S.category];let ch=pool.filter(q=>!S.recent.includes(q.q));
  if(!ch.length){S.recent=[];ch=pool;}const q=ch[Math.floor(Math.random()*ch.length)];
  S.recent.push(q.q);if(S.recent.length>Math.min(8,pool.length-1))S.recent.shift();
  return {text:q.q,correct:q.a,answers:shuffle([q.a,...q.o])};}
function pickQuestion(){
  const cat=S.category;
  if(AI_ENABLED){
    topUpQueue(cat); // keep refilling in the background regardless of what we return below
    const st=getAIState(cat);
    if(st.queue.length)return st.queue.shift();
  }
  return pickFromBank(); // instant fallback — never makes the player wait on a network call
}

function startTimer(correct,player,i,el){clearInterval(timerId);const bar=document.getElementById("qBar");
  bar.style.width="100%";bar.classList.remove("low");const total=10000,step=100;let e=0;
  timerId=setInterval(()=>{e+=step;const pct=Math.max(0,100-(e/total*100));bar.style.width=pct+"%";
    if(pct<=30)bar.classList.add("low");if(pct<=0){clearInterval(timerId);resolve(null,correct,player,i,el,true);}},step);}
function answer(btn,opt,correct,player,i,el){if(btn.disabled)return;clearInterval(timerId);resolve(opt,correct,player,i,el,false,btn);}
function resolve(chosen,correct,player,i,el,timeout,btn){
  [...el.children].forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add("correct");else b.classList.add("dim");});
  const right=chosen===correct;if(btn&&!right){btn.classList.remove("dim");btn.classList.add("wrong");}
  right?sRight():sWrong();
  setTimeout(()=>{document.getElementById("scrim").classList.remove("show");
    if(right){placeMark(i,player);}
    else{if(player==="X")toast(timeout?"⏱ Time's up — turn passes":"Not quite — turn passes");
      else toast(timeout?"Computer ran out of time":"Computer missed");switchTurn();}
    S.locked=false;if(!S.over&&S.mode==="solo"&&S.turn==="O")setTimeout(cpuTurn,600);
  },right?680:920);}
function placeMark(i,player){S.board[i]=player;sPlace();
  const c=document.querySelector(`.cell[data-i="${i}"]`);c.classList.add("taken");c.innerHTML=markSVG(player);
  const w=getWin();if(w){endRound(player,w);return;}if(S.board.every(Boolean)){endRound(null,null);return;}switchTurn();}
function switchTurn(){S.turn=S.turn==="X"?"O":"X";updateTurn();}
function getWin(){for(const L of LINES){const[a,b,c]=L;if(S.board[a]&&S.board[a]===S.board[b]&&S.board[b]===S.board[c])return{who:S.board[a],line:L};}return null;}

function cpuTurn(){if(S.over)return;const i=cpuPick();if(i==null){if(S.board.every(Boolean))endRound(null,null);return;}
  askQuestion(i,"O");setTimeout(cpuAnswer,850+Math.random()*500);}
function cpuPick(){const b=S.board,empty=[...Array(9).keys()].filter(k=>!b[k]);if(!empty.length)return null;
  const smart=Math.random()<DIFF[S.diff].smart;
  if(smart){for(const k of empty){b[k]="O";const w=getWin();b[k]=null;if(w&&w.who==="O")return k;}
    for(const k of empty){b[k]="X";const w=getWin();b[k]=null;if(w&&w.who==="X")return k;}
    if(empty.includes(4))return 4;const cor=[0,2,6,8].filter(k=>empty.includes(k));if(cor.length)return cor[Math.floor(Math.random()*cor.length)];}
  return empty[Math.floor(Math.random()*empty.length)];}
function cpuAnswer(){const el=document.getElementById("answers");if(!el.children.length)return;
  const right=Math.random()<DIFF[S.diff].acc;const btns=[...el.children];
  let pick=right?btns.find(b=>b.textContent===S.curCorrect):(()=>{const w=btns.filter(b=>b.textContent!==S.curCorrect);return w[Math.floor(Math.random()*w.length)];})();
  if(pick)pick.click();}

function endRound(winner,win){S.over=true;
  if(win)win.line.forEach(idx=>document.querySelector(`.cell[data-i="${idx}"]`).classList.add("win"));
  if(winner)S.scores[winner]++;else S.scores.D++;renderScores();
  if(winner==="X"||(winner==="O"&&S.mode==="two")){sWin();confetti();}
  setTimeout(()=>showEnd(winner),700);}
function showEnd(winner){const em=document.getElementById("endEmoji"),ti=document.getElementById("endTitle"),su=document.getElementById("endSub");
  if(!winner){em.textContent="🤝";ti.textContent="It's a draw";su.textContent="Board's full — run it back.";}
  else if(winner==="X"){em.textContent="🎉";ti.textContent="You win!";su.textContent="Three in a row. Well played.";}
  else{em.textContent=S.mode==="solo"?"🤖":"🎉";ti.textContent=S.mode==="solo"?"Computer wins":"Player O wins!";su.textContent="Three in a row.";}
  document.getElementById("endScrim").classList.add("show");}
function closeEnd(){document.getElementById("endScrim").classList.remove("show");}
function renderScores(){document.getElementById("scoreX").textContent=S.scores.X;document.getElementById("scoreO").textContent=S.scores.O;document.getElementById("scoreD").textContent=S.scores.D;}

function confetti(){const colors=["#ff7a7e","#37e3d2","#f6c453","#9b7bff","#fff"];
  for(let i=0;i<70;i++){const d=document.createElement("div");d.className="confetti";
    d.style.left=Math.random()*100+"vw";d.style.background=colors[i%colors.length];
    const dur=2.2+Math.random()*1.8,delay=Math.random()*.4;
    d.animate([{transform:"translateY(-20px) rotate(0deg)",opacity:1},
      {transform:`translateY(105vh) rotate(${600+Math.random()*400}deg)`,opacity:.9}],
      {duration:dur*1000,delay:delay*1000,easing:"cubic-bezier(.3,.6,.6,1)"});
    document.body.appendChild(d);setTimeout(()=>d.remove(),(dur+delay)*1000+100);}}

document.getElementById("newBtn").onclick=newRound;
document.getElementById("endAgain").onclick=newRound;
document.getElementById("menuBtn").onclick=backToMenu;
document.getElementById("endMenu").onclick=backToMenu;
function backToMenu(){closeEnd();document.getElementById("game").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");}
let toastId=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastId);toastId=setTimeout(()=>t.classList.remove("show"),1700);}

/* ===== background music (gentle, generated) ===== */
let musicOn=true,musicT=null,mI=0;
const CHORDS=[[262,330,392],[247,294,392],[220,277,349],[196,247,330]];
function mNote(f,t0,dur,v){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;
  g.gain.value=0;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.04);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.start(t0);o.stop(t0+dur+.05);}
function mTick(){if(!musicOn)return;const c=ac();if(!c){musicT=setTimeout(mTick,500);return;}
  const ch=CHORDS[mI%CHORDS.length];const t=c.currentTime;
  ch.forEach((f,k)=>mNote(f,t+k*0.0,1.4,.018));mNote(ch[0]/2,t,1.4,.02);
  mI++;musicT=setTimeout(mTick,1500);}
function startMusic(){if(!musicOn)return;if(musicT)return;ac();mTick();}
function stopMusic(){clearTimeout(musicT);musicT=null;}
document.getElementById("musicBtn").onclick=function(){musicOn=!musicOn;this.textContent=musicOn?"🎵":"🎶";this.classList.toggle("off",!musicOn);if(musicOn)startMusic();else stopMusic();};

</script>
